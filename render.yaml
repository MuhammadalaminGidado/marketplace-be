services:
  - type: web
    name: your-go-api
    runtime: go
    plan: free # or starter/professional
    rootDir: ./ # Your main.go is in cmd/api, but we handle this with build command
    buildCommand: |
      go build -o app ./cmd/api
    startCommand: ./app
    healthCheckPath: /health
    envVars:
      # Environment
      - key: ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000

      # PostgreSQL - Render managed DB (DATABASE_URL is injected automatically)
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce_prod
          property: connectionString

      # Redis
      - key: REDIS_URL
        sync: false # Set manually in dashboard

      # Alternative: Individual Redis vars
      - key: REDIS_ADDR
        sync: false
      - key: REDIS_PASSWORD
        sync: false

# SMTP (OTP email delivery) - falls back to console logging if unset
      # Resend: username "resend", password = API key; 465 = implicit TLS.
      # onboarding@resend.dev is Resend's test-only shared domain: it can only
      # deliver to the email on the Resend account. Verify a domain to email
      # other recipients.
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "2465"
      - key: SMTP_USERNAME
        value: resend
      - key: SMTP_PASSWORD
        sync: false # Resend API key (re_...) - set in dashboard
      - key: SMTP_FROM
        value: onboarding@resend.dev
      - key: APP_NAME
        value: Local Marketplace

databases:
  - name: ecommerce_prod
    databaseName: ecommerce_prod_db_vq57
    user: ecommerce_prod_db_vq57_user
    plan: free
